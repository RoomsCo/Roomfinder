<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | RoomFinder</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth auth--login">
    <header class="auth-header">
        <a class="auth-brand" href="../../index.html">
            <span class="auth-brand__mark"><img src="../../img/auth/map-pin-house.svg" alt="" width="18" height="18"></span>
            <span class="auth-brand__name">RoomFinder</span>
        </a>
        <span class="auth-lang" aria-label="Idiomas del prototipo: español e inglés">
            <img src="../../img/auth/globe.svg" alt="" width="14" height="14">
            <span>ES | EN</span>
        </span>
    </header>

    <main class="auth-main" id="login">
        <section class="auth-card" aria-labelledby="login-titulo">
            <h1 class="auth-card__title" id="login-titulo">Bienvenido de nuevo</h1>
            <p class="auth-card__text">Ingresa con tu correo y contraseña.</p>
            <nav class="auth-tabs" aria-label="Acceso">
                <a class="auth-tabs__tab auth-tabs__tab--active" aria-current="page" href="login.html">Iniciar sesión</a>
                <a class="auth-tabs__tab" href="crear-cuenta.html">Crear cuenta</a>
            </nav>
            <!-- TB3: navegación por enlaces; este formulario no envía datos. -->
            <form class="auth-form" method="dialog">
            <div class="auth-field">
                <label class="auth-field__label" for="email">Correo electrónico</label>
                <div class="auth-field__control">
                    <img class="auth-field__icon" src="../../img/auth/mail.svg" alt="" width="16" height="16">
                    <input class="auth-field__input" id="email" autocomplete="email" aria-describedby="email-error" name="email" type="email" value="maria.lopez@upc.edu.pe" required>
                </div>
                <p class="auth-field__error" id="email-error">Ingresa un correo válido, por ejemplo nombre@upc.edu.pe.</p>
            </div>
            <div class="auth-field">
                <label class="auth-field__label" for="password">Contraseña</label>
                <div class="auth-field__control">
                    <img class="auth-field__icon" src="../../img/auth/lock.svg" alt="" width="16" height="16">
                    <input class="auth-field__input" id="password" autocomplete="current-password" aria-describedby="password-error" name="password" type="password" value="12345678" required minlength="8">
                    <span class="auth-field__toggle" aria-hidden="true"><img src="../../img/auth/eye.svg" alt="" width="16" height="16"></span>
                </div>
                <p class="auth-field__error" id="password-error">Ingresa tu contraseña (mínimo 8 caracteres).</p>
            </div>
                <div class="auth-form__row">
                    <label class="auth-check" for="remember">
                        <input class="auth-check__input" id="remember" name="remember" type="checkbox">
                        Recordarme
                    </label>
                    <a class="auth-link" href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
                </div>
                <a class="auth-button" href="../estudiante/explorar.html">Iniciar sesión</a>
            </form>
            <footer class="auth-card__footer auth-login__footer" id="login-registro">¿No tienes cuenta? <a class="auth-link" href="crear-cuenta.html">Crear cuenta</a></footer>
        </section>
    </main>
</body>
</html>
