<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | RoomFinder</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth">
    <header class="auth-header">
        <a class="auth-brand" href="../../index.html">
            <img class="auth-brand__mark" src="../../img/logo-mark.svg" alt="" width="32" height="32">
            <span class="auth-brand__name">RoomFinder</span>
        </a>
        <a class="auth-lang" href="#" aria-label="Cambiar idioma">
            <img src="../../img/icon-globe.svg" alt="" width="14" height="14">
            <span>ES | EN</span>
        </a>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <h1 class="auth-card__title">Bienvenido de nuevo</h1>
            <p class="auth-card__text">Ingresa con tu correo y contraseña.</p>
            <nav class="auth-tabs" aria-label="Acceso">
                <a class="auth-tabs__tab auth-tabs__tab--active" href="login.html">Iniciar sesión</a>
                <a class="auth-tabs__tab" href="crear-cuenta.html">Crear cuenta</a>
            </nav>
            <form class="auth-form" action="../estudiante/explorar.html">
            <div class="auth-field">
                <label class="auth-field__label" for="email">Correo electrónico</label>
                <div class="auth-field__control">
                    <img class="auth-field__icon" src="../../img/icon-mail.svg" alt="" width="16" height="16">
                    <input class="auth-field__input" id="email" name="email" type="email" value="maria.lopez@upc.edu.pe" required>
                </div>
                <p class="auth-field__error">Ingresa un correo válido, por ejemplo nombre@upc.edu.pe.</p>
            </div>
            <div class="auth-field">
                <label class="auth-field__label" for="password">Contraseña</label>
                <div class="auth-field__control">
                    <img class="auth-field__icon" src="../../img/icon-lock.svg" alt="" width="16" height="16">
                    <input class="auth-field__input" id="password" name="password" type="password" value="12345678" required minlength="8">
                    <a class="auth-field__toggle" href="#" aria-label="Mostrar contraseña"><img src="../../img/icon-eye.svg" alt="" width="16" height="16"></a>
                </div>
                <p class="auth-field__error">Ingresa tu contraseña (mínimo 8 caracteres).</p>
            </div>
                <div class="auth-form__row">
                    <label class="auth-check" for="remember">
                        <input class="auth-check__input" id="remember" name="remember" type="checkbox">
                        Recordarme
                    </label>
                    <a class="auth-link" href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
                </div>
                <a class="auth-button" href="../estudiante/explorar.html">Iniciar sesión</a>
            </form>
            <p class="auth-card__footer">¿No tienes cuenta? <a class="auth-link" href="crear-cuenta.html">Crear cuenta</a></p>
        </section>
    </main>
</body>
</html>
