<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de rol | RoomFinder</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth auth--seleccion-rol">
    <header class="auth-header">
        <a class="auth-brand" href="../../index.html">
            <span class="auth-brand__mark"><img src="../../img/auth/map-pin-house.svg" alt="" width="18" height="18"></span>
            <span class="auth-brand__name">RoomFinder</span>
        </a>
    </header>

    <main class="auth-main auth-main--wide" id="seleccion-rol">
        <section class="role" aria-labelledby="rol-titulo">
            <header class="role__heading">
                <h1 class="role__title" id="rol-titulo">¿Qué quieres hacer hoy?</h1>
                <p class="role__text">Elige una opción para personalizar tu experiencia.</p>
            </header>
            <nav class="role__options" id="opciones-rol" aria-label="Elige tu rol">
                <a class="role-card" href="verificar-correo.html">
                    <img class="role-card__icon" src="../../img/auth/locate.svg" alt="" width="32" height="32">
                    <h2 class="role-card__title">Busco alojamiento</h2>
                    <p class="role-card__text">Compara precio, ubicación y convivencia.</p>
                </a>
                <a class="role-card" href="../anfitrion/panel.html">
                    <img class="role-card__icon" src="../../img/auth/circle-x.svg" alt="" width="32" height="32">
                    <h2 class="role-card__title">Ofrezco una habitación</h2>
                    <p class="role-card__text">Publica, recibe solicitudes y elige roomie.</p>
                </a>
            </nav>
            <p class="role__error" id="rol-ayuda">
                <img src="../../img/auth/alert.svg" alt="" width="20" height="20">
                Elige un rol para continuar.
            </p>
            <!-- Estado inicial del mock-up. Las tarjetas enlazan a cada flujo sin guardar el rol. -->
            <span class="role__continue" aria-disabled="true">Continuar</span>
        </section>
    </main>
</body>
</html>
