<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de rol | RoomFinder</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="auth">
    <header class="auth-header">
        <a class="auth-brand" href="../../index.html">
            <img class="auth-brand__mark" src="../../img/logo-mark.svg" alt="" width="32" height="32">
            <span class="auth-brand__name">RoomFinder</span>
        </a>
    </header>

    <main class="auth-main auth-main--wide">
        <section class="role">
            <h1 class="role__title">¿Qué quieres hacer hoy?</h1>
            <p class="role__text">Elige una opción para personalizar tu experiencia.</p>
            <div class="role__options">
                <a class="role-card" href="verificar-correo.html">
                    <img class="role-card__icon" src="../../img/icon-locate.svg" alt="" width="28" height="28">
                    <h2 class="role-card__title">Busco alojamiento</h2>
                    <p class="role-card__text">Compara precio, ubicación y convivencia.</p>
                </a>
                <a class="role-card" href="../anfitrion/panel.html">
                    <img class="role-card__icon" src="../../img/icon-circle-x.svg" alt="" width="28" height="28">
                    <h2 class="role-card__title">Ofrezco una habitación</h2>
                    <p class="role-card__text">Publica, recibe solicitudes y elige roomie.</p>
                </a>
            </div>
            <p class="role__error">
                <img src="../../img/icon-alert.svg" alt="" width="18" height="18">
                Elige un rol para continuar.
            </p>
            <a class="role__continue" href="verificar-correo.html">Continuar</a>
        </section>
    </main>
</body>
</html>
