<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud enviada | RoomFinder</title>
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="app">
    <header class="app-header">
        <a class="app-brand" href="explorar.html">
            <img class="app-brand__mark" src="../../img/logo-mark.svg" alt="" width="32" height="32">
            <span class="app-brand__name">RoomFinder</span>
        </a>
        <nav class="app-nav" aria-label="Navegación del estudiante">
            <a class="app-nav__link" href="explorar.html">Explorar</a>
            <a class="app-nav__link" href="favoritos.html">Favoritos</a>
            <a class="app-nav__link app-nav__link--active" href="mis-solicitudes.html" aria-current="page">Mis solicitudes</a>
            <a class="app-nav__link" href="#">Ayuda</a>
        </nav>
        <a class="app-user" href="perfil.html">
            <img src="../../img/icon-circle-check.svg" alt="" width="14" height="14">
            <span>María</span>
        </a>
        <a class="app-header__menu" href="#" aria-label="Abrir menú">
            <img src="../../img/icon-menu.svg" alt="" width="20" height="20">
        </a>
    </header>

    <main class="app-main app-main--center">
        <section class="confirm">
            <span class="confirm__icon">
                <img src="../../img/icon-circle-check.svg" alt="" width="36" height="36">
            </span>
            <h1 class="confirm__title">¡Solicitud enviada!</h1>
            <p class="confirm__text">Andrea recibió tu solicitud para el sábado 26 de septiembre a las 11:30. Te notificaremos cuando responda.</p>
            <span class="badge badge--teal"><img src="../../img/icon-circle-check.svg" alt="" width="14" height="14">Estado: enviada</span>
            <div class="confirm__actions">
                <a class="app-button app-button--primary" href="mis-solicitudes.html">Ver mis solicitudes</a>
                <a class="app-button app-button--secondary" href="explorar.html">Volver a explorar</a>
            </div>
            <p class="confirm__next">Próximo paso: espera la confirmación del anfitrión.</p>
        </section>
    </main>
</body>
</html>
